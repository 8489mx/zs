# إعداد nginx لسيرفر الإنتاج على أوراكل — منسوخ من /etc/nginx/sites-enabled/default
# كما كان يعمل فعلياً في 22 سبتمبر 2026. يُستخدم عند نقل السيستم لسيرفر جديد
# (docs/DISASTER_RECOVERY.md). استبدل YOUR_DOMAIN باسم الدومين أو بعنوان sslip
# (مثال: 92-5-178-54.sslip.io)، ثم شغّل certbot ليضيف أسطر الشهادة.
#
# ملاحظة: deploy/nginx/gateway.conf ملف مختلف خاص بإعداد Docker Compose، وليس هذا.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name YOUR_DOMAIN;

    root /var/www/zsystems/app/frontend/dist;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
