# Real visitor IP behind Cloudflare. Without it nginx logs, X-Real-IP and every per-IP limit in the
# backend (login attempts, storefront order rate limit) see Cloudflare's edge address, so unrelated
# visitors share one counter and one attacker is not told apart.
#
# Installed on the server as /etc/nginx/conf.d/cloudflare-realip.conf (22 Sep 2026). Regenerate from
# Cloudflare's published ranges rather than editing by hand:
#   { for ip in $(curl -fsS https://www.cloudflare.com/ips-v4) $(curl -fsS https://www.cloudflare.com/ips-v6); do echo "set_real_ip_from $ip;"; done; echo "real_ip_header CF-Connecting-IP;"; } | sudo tee /etc/nginx/conf.d/cloudflare-realip.conf > /dev/null
#   sudo nginx -t && sudo systemctl reload nginx
# Only these ranges are trusted, so a direct hit on the server IP cannot forge CF-Connecting-IP.
