# SF-10 — ERP on app.zsystemai.com, every store on <slug>.zsystemai.com (same backend, same database).
#
# Install next to the existing site (deploy/nginx/oracle-site.conf keeps serving the apex and the IP
# until the marketing site moves to Cloudflare Pages):
#   sudo cp deploy/nginx/zsystemai-subdomains.conf /etc/nginx/sites-available/zsystemai-subdomains
#   sudo ln -s /etc/nginx/sites-available/zsystemai-subdomains /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: Cloudflare Origin Certificate for "zsystemai.com, *.zsystemai.com" saved as the two files below;
# Cloudflare SSL/TLS mode "Full (strict)". Full steps: docs/DEPLOYMENT_PIPELINE.md §2-d.
#
# Turn the app side on in the same change: STOREFRONT_ROOT_DOMAIN=zsystemai.com in backend/.env and the
# GitHub variable VITE_STOREFRONT_ROOT_DOMAIN=zsystemai.com, then redeploy.

# Link-preview crawlers do not run JavaScript; they get Open Graph tags from the backend instead
# (same list as deploy/nginx/gateway.conf).
map $http_user_agent $zs_is_crawler {
  default                     0;
  "~*facebookexternalhit"     1;
  "~*WhatsApp"                1;
  "~*Twitterbot"              1;
  "~*Slackbot"                1;
  "~*TelegramBot"             1;
  "~*LinkedInBot"             1;
  "~*Discordbot"              1;
  "~*Pinterest"               1;
  "~*Googlebot"               1;
  "~*bingbot"                 1;
  "~*Applebot"                1;
  "~*SkypeUriPreview"         1;
  "~*vkShare"                 1;
  "~*redditbot"               1;
  "~*Embedly"                 1;
}

# ---------------------------------------------------------------------------------------------------
# ERP: app.zsystemai.com
# ---------------------------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.zsystemai.com;

    ssl_certificate     /etc/ssl/zsystemai/origin.pem;
    ssl_certificate_key /etc/ssl/zsystemai/origin.key;

    root /var/www/zsystems/app/frontend/dist;
    index index.html;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Old store links opened on the ERP host go to the store's own subdomain. The URL fragment
    # (#t=<order token> on tracking links) is kept by the browser across the redirect.
    location ~ "^/(?:st|store|shop)/([a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)(/.*)?$" {
        return 301 https://$1.zsystemai.com$2$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------------------------------
# www → apex (the marketing site). Exact names win over the store regex below.
# ---------------------------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.zsystemai.com;

    ssl_certificate     /etc/ssl/zsystemai/origin.pem;
    ssl_certificate_key /etc/ssl/zsystemai/origin.key;

    return 301 https://zsystemai.com$request_uri;
}

# ---------------------------------------------------------------------------------------------------
# Stores: <slug>.zsystemai.com — the frontend sees the host and renders only the storefront
# (frontend/src/lib/store-public-url.ts). Reserved names never reach a store:
# the frontend refuses them and the backend refuses to assign them.
# ---------------------------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name "~^(?<store>[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)\.zsystemai\.com$";

    ssl_certificate     /etc/ssl/zsystemai/origin.pem;
    ssl_certificate_key /etc/ssl/zsystemai/origin.key;

    root /var/www/zsystems/app/frontend/dist;
    index index.html;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Product page and store home for link-preview crawlers.
    # Named capture: a bare $1 would be reset by the rewrite's own regex.
    location ~ "^/p/(?<product_id>[0-9]+)/?$" {
        if ($zs_is_crawler) {
            rewrite ^ /api/storefront/$store/social-preview/$product_id last;
        }
        try_files $uri /index.html;
    }

    location = / {
        if ($zs_is_crawler) {
            rewrite ^ /api/storefront/$store/social-preview last;
        }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
