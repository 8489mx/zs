# زواحف التواصل والبحث لا تنفّذ JavaScript، فالتطبيق أحادي الصفحة يبدو لها فارغاً
# (لا عنوان ولا صورة ولا وصف) وأي رابط متجر أو منتج يُرسَل في واتساب يظهر كنص عارٍ
# بلا بطاقة معاينة. هذه الخريطة تميّز الزاحف لنوجّهه وحده إلى نقطة تولّد وسوم
# Open Graph من بيانات المتجر الحقيقية. المستخدم العادي يُخدَّم التطبيق كالمعتاد.
map $http_user_agent $zs_is_crawler {
  default                     0;
  "~*facebookexternalhit"     1;
  "~*WhatsApp"                1;
  "~*Twitterbot"              1;
  "~*Slackbot"                1;
  "~*TelegramBot"             1;
  "~*LinkedInBot"             1;
  "~*Discordbot"              1;
  "~*Pinterest"               1;
  "~*Googlebot"               1;
  "~*bingbot"                 1;
  "~*Applebot"                1;
  "~*SkypeUriPreview"         1;
  "~*vkShare"                 1;
  "~*redditbot"               1;
  "~*Embedly"                 1;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # مسارات المتجر العامة: صفحة منتج أو صفحة متجر.
  # الزاحف يُعاد توجيهه داخلياً لنقطة المعاينة؛ غيره يكمل إلى التطبيق.
  location ~ ^/(?:st|store|shop)/ {
    if ($zs_is_crawler) {
      rewrite ^/(?:st|store|shop)/([^/]+)/p/([^/?]+) /api/storefront/$1/social-preview/$2 last;
    }
    if ($zs_is_crawler) {
      rewrite ^/(?:st|store|shop)/([^/?]+) /api/storefront/$1/social-preview last;
    }

    proxy_pass http://frontend:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://frontend:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
