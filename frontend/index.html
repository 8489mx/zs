<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Z-ERP</title>
    <link rel="icon" type="image/svg+xml" href="/z-erp-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <style>
        .initial-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          width: 100vw;
          background-color: #f8fafc;
          font-family: 'Cairo', 'Tajawal', sans-serif;
          color: #0f172a;
        }
        .spinner {
          width: 40px;
          height: 40px;
          border: 3px solid #e2e8f0;
          border-top-color: #2563eb;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
          margin-bottom: 16px;
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
        @media (prefers-color-scheme: dark) {
          .initial-loader { background-color: #0f172a; color: #f8fafc; }
          .spinner { border-color: #334155; border-top-color: #3b82f6; }
        }
      </style>
      <div class="initial-loader">
        <div class="spinner"></div>
        <h3 style="margin: 0; font-weight: 600; font-size: 1.1rem; color: #64748b;">جاري تحميل النظام...</h3>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
