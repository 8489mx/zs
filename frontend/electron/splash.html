<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ZSystems Loading</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at 50% 40%, #1e1b4b 0%, #0f172a 70%, #020617 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      user-select: none;
    }
    .logo-wrap {
      margin-bottom: 18px;
    }
    .logo-img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      filter: drop-shadow(0 6px 16px rgba(99, 102, 241, 0.4));
    }
    .loader {
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-top: 3px solid #6366f1;
      border-right: 3px solid #3b82f6;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 0.8s linear infinite;
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.3);
    }
    .text {
      margin-top: 14px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #94a3b8;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <img class="logo-img" src="../public/logo_cropped.png" alt="ZSystems Logo" onerror="this.style.display='none'">
  </div>
  <div class="loader"></div>
  <div class="text">جاري تشغيل النظام...</div>
</body>
</html>
