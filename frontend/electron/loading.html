<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z-ERP Enterprise</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 35%, #17153b 0%, #0d1224 60%, #030712 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans Arabic', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Ambient dynamic glow */
    .glow-orb {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.22) 0%, rgba(16, 185, 129, 0.1) 45%, transparent 70%);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: blur(60px);
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      from { transform: translate(-50%, -50%) scale(0.95); opacity: 0.7; }
      to { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
    }

    /* Luxury Dark Glassmorphism Card — Fixed & Rock-Solid Stability */
    .card {
      position: relative;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 28px;
      padding: 38px 44px 34px;
      text-align: center;
      box-shadow: 0 35px 80px -15px rgba(0, 0, 0, 0.85), 0 0 40px rgba(99, 102, 241, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      width: 480px;
      max-width: 90vw;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      z-index: 10;
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 3D Stylized Z Emblem */
    .logo-box {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.02) 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 22px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 0 25px rgba(99, 102, 241, 0.3);
      animation: floatBadge 3.5s ease-in-out infinite alternate;
    }

    @keyframes floatBadge {
      from { transform: translateY(0); }
      to { transform: translateY(-5px); }
    }

    .logo-svg {
      width: 48px;
      height: 48px;
      filter: drop-shadow(0 4px 10px rgba(99, 102, 241, 0.5));
    }

    .title {
      font-size: 1.85rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 30%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .subtitle {
      font-size: 0.92rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 26px;
      line-height: 1.5;
    }

    /* Progress & Metrics Section */
    .progress-section {
      width: 100%;
      margin-bottom: 16px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 0 2px;
    }

    .progress-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: #94a3b8;
    }

    .progress-percent {
      font-size: 0.85rem;
      font-weight: 900;
      color: #10b981;
      font-family: monospace, sans-serif;
      text-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 15%;
      background: linear-gradient(90deg, #6366f1 0%, #3b82f6 50%, #10b981 100%);
      border-radius: 999px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
      animation: shimmer 1.6s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .status-box {
      width: 100%;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .status-text {
      font-size: 0.86rem;
      color: #cbd5e1;
      font-weight: 600;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      transition: opacity 0.25s ease;
    }

    /* Dynamic Version Pill */
    .version-pill {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 18px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      z-index: 10;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .version-dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px #10b981;
    }
  </style>
</head>
<body>
  <div class="glow-orb"></div>

  <div class="card">
    <div class="logo-box">
      <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="zGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#818cf8"/>
            <stop offset="50%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#34d399"/>
          </linearGradient>
        </defs>
        <path d="M 22 22 H 78 L 46 72 H 78 V 84 H 22 L 54 34 H 22 Z" fill="url(#zGrad)" />
      </svg>
    </div>

    <div class="title">Z-ERP Enterprise</div>
    <div class="subtitle">منظومة إدارة المبيعات ونقاط التشغيل والمخازن</div>

    <div class="progress-section">
      <div class="progress-header">
        <span class="progress-label">تهيئة المنظومة...</span>
        <span class="progress-percent" id="progressPercent">15%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressBar"></div>
      </div>
    </div>

    <div class="status-box">
      <div class="status-text" id="statusText">جاري تشغيل محرك قواعد البيانات والخدمات المحلية...</div>
    </div>
  </div>

  <div class="version-pill" id="versionBadge">
    <span class="version-dot"></span>
    <span id="versionText">نظام مؤمن • v1.1.23</span>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let ver = urlParams.get('v');
    try {
      const cached = localStorage.getItem('zs.app_display_version');
      if (cached) ver = cached;
    } catch (e) {}
    if (ver) {
      document.getElementById('versionText').textContent = 'نظام مؤمن • v' + ver.replace(/^v/i, '');
    }
    async function updateVersionFromBackend() {
      for (const p of [3001, 3002, 3003, 3004, 3005, 3101]) {
        try {
          const res = await fetch('http://127.0.0.1:' + p + '/api/updates/version');
          if (res.ok) {
            const data = await res.json();
            if (data && data.version) {
              document.getElementById('versionText').textContent = 'نظام مؤمن • v' + data.version.replace(/^v/i, '');
              try { localStorage.setItem('zs.app_display_version', data.version); } catch (e) {}
              break;
            }
          }
        } catch (e) {}
      }
    }
    updateVersionFromBackend();
    const verInterval = setInterval(updateVersionFromBackend, 600);
    setTimeout(() => clearInterval(verInterval), 8000);
    const bar = document.getElementById('progressBar');
    const percentEl = document.getElementById('progressPercent');
    const statusText = document.getElementById('statusText');
    const steps = [
      { pct: 25, text: 'جاري تشغيل محرك قواعد البيانات والخدمات المحلية...', delay: 200 },
      { pct: 55, text: 'التحقق من سلامة البيانات والتراخيص المعتمدة...', delay: 1000 },
      { pct: 85, text: 'تجهيز واجهات نقطة البيع وتهيئة بيئة العمل...', delay: 1900 },
      { pct: 100, text: 'اكتمل الإقلاع بنجاح! جاري فتح المنظومة...', delay: 2700 },
    ];
    steps.forEach(s => {
      setTimeout(() => {
        if (bar) bar.style.width = s.pct + '%';
        if (percentEl) percentEl.textContent = s.pct + '%';
        if (statusText) {
          statusText.style.opacity = '0';
          setTimeout(() => {
            statusText.textContent = s.text;
            statusText.style.opacity = '1';
          }, 150);
        }
      }, s.delay);
    });
  </script>
</body>
</html>
