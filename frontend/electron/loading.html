<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z-ERP Enterprise</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.2) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.15) 0px, transparent 50%),
        radial-gradient(circle at 50% 40%, #1a1744 0%, #0d1322 65%, #030712 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans Arabic', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
    }

    /* Subtle Architectural Background Grid */
    .bg-grid {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      pointer-events: none;
      mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 80%);
    }

    /* Ambient Pulsing Glow */
    .glow-orb {
      position: absolute;
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(16, 185, 129, 0.12) 45%, transparent 70%);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: blur(70px);
      animation: pulseGlow 4.5s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      from { transform: translate(-50%, -50%) scale(0.92); opacity: 0.65; }
      to { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
    }

    /* Ultra-Premium Executive Pearl White Card */
    .card {
      position: relative;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 32px;
      padding: 44px 48px 38px;
      text-align: center;
      box-shadow: 
        0 0 0 1px rgba(0, 0, 0, 0.04),
        0 25px 50px -12px rgba(0, 0, 0, 0.35),
        0 45px 90px -20px rgba(15, 23, 42, 0.5),
        0 0 45px rgba(99, 102, 241, 0.2);
      width: 490px;
      max-width: 90vw;
      min-height: 395px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: cardAppear 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      z-index: 10;
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 3D Metallic Emblem Badge */
    .logo-container {
      position: relative;
      margin-bottom: 22px;
    }

    .logo-box {
      width: 86px;
      height: 86px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
      border: 2px solid #e2e8f0;
      border-radius: 24px;
      box-shadow: 
        0 14px 28px -6px rgba(0, 0, 0, 0.12),
        0 0 0 1px rgba(255, 255, 255, 0.8) inset,
        0 0 20px rgba(99, 102, 241, 0.15);
      animation: floatBadge 3.5s ease-in-out infinite alternate;
    }

    @keyframes floatBadge {
      from { transform: translateY(0); }
      to { transform: translateY(-5px); }
    }

    .logo-svg {
      width: 52px;
      height: 52px;
      filter: drop-shadow(0 4px 8px rgba(79, 70, 229, 0.3));
    }

    .title {
      font-size: 1.95rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.92rem;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* Progress Track & Details */
    .progress-section {
      width: 100%;
      margin-bottom: 18px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .progress-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .progress-percent {
      font-size: 0.88rem;
      font-weight: 900;
      color: #059669;
      font-family: monospace, sans-serif;
      background: #ecfdf5;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid #a7f3d0;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      border: 1px solid #cbd5e1;
    }

    .progress-fill {
      height: 100%;
      width: 15%;
      background: linear-gradient(90deg, #4f46e5 0%, #3b82f6 50%, #10b981 100%);
      border-radius: 999px;
      transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .status-box {
      width: 100%;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .status-text {
      font-size: 0.88rem;
      color: #334155;
      font-weight: 700;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      transition: opacity 0.2s ease;
    }

    /* Dynamic Version & License Pill */
    .version-pill {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 7px 20px;
      border-radius: 999px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .version-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 10px #10b981;
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow-orb"></div>

  <div class="card">
    <div class="logo-container">
      <div class="logo-box">
        <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="zEmblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#4f46e5"/>
              <stop offset="50%" stop-color="#2563eb"/>
              <stop offset="100%" stop-color="#059669"/>
            </linearGradient>
          </defs>
          <path d="M 22 22 H 78 L 46 72 H 78 V 84 H 22 L 54 34 H 22 Z" fill="url(#zEmblemGrad)" />
        </svg>
      </div>
    </div>

    <div class="title">Z-ERP Enterprise</div>
    <div class="subtitle">منظومة إدارة المبيعات ونقاط التشغيل والمخازن</div>

    <div class="progress-section">
      <div class="progress-header">
        <span class="progress-label">تهيئة المنظومة</span>
        <span class="progress-percent" id="progressPercent">15%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressBar"></div>
      </div>
    </div>

    <div class="status-box">
      <div class="status-text" id="statusText">جاري تشغيل محرك قواعد البيانات والخدمات المحلية...</div>
    </div>
  </div>

  <div class="version-pill" id="versionBadge">
    <span class="version-dot"></span>
    <span id="versionText">نظام مؤمن • v1.1.23</span>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let ver = urlParams.get('v');
    try {
      const cached = localStorage.getItem('zs.app_display_version');
      if (cached) ver = cached;
    } catch (e) {}
    if (ver) {
      document.getElementById('versionText').textContent = 'نظام مؤمن • v' + ver.replace(/^v/i, '');
    }
    async function updateVersionFromBackend() {
      for (const p of [3001, 3002, 3003, 3004, 3005, 3101]) {
        try {
          const res = await fetch('http://127.0.0.1:' + p + '/api/updates/version');
          if (res.ok) {
            const data = await res.json();
            if (data && data.version) {
              document.getElementById('versionText').textContent = 'نظام مؤمن • v' + data.version.replace(/^v/i, '');
              try { localStorage.setItem('zs.app_display_version', data.version); } catch (e) {}
              break;
            }
          }
        } catch (e) {}
      }
    }
    updateVersionFromBackend();
    const verInterval = setInterval(updateVersionFromBackend, 600);
    setTimeout(() => clearInterval(verInterval), 8000);
    
    const bar = document.getElementById('progressBar');
    const percentEl = document.getElementById('progressPercent');
    const statusText = document.getElementById('statusText');
    const steps = [
      { pct: 25, text: 'جاري تشغيل محرك قواعد البيانات والخدمات المحلية...', delay: 200 },
      { pct: 55, text: 'التحقق من سلامة البيانات والتراخيص المعتمدة...', delay: 1000 },
      { pct: 85, text: 'تجهيز واجهات نقطة البيع وتهيئة بيئة العمل...', delay: 1900 },
      { pct: 100, text: 'اكتمل الإقلاع بنجاح! جاري فتح المنظومة...', delay: 2700 },
    ];
    steps.forEach(s => {
      setTimeout(() => {
        if (bar) bar.style.width = s.pct + '%';
        if (percentEl) percentEl.textContent = s.pct + '%';
        if (statusText) {
          statusText.style.opacity = '0';
          setTimeout(() => {
            statusText.textContent = s.text;
            statusText.style.opacity = '1';
          }, 120);
        }
      }, s.delay);
    });
  </script>
</body>
</html>
