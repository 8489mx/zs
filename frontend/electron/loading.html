<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZSystems POS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at 50% 35%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Ambient background glow */
    .glow-orb {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(59, 130, 246, 0.05) 50%, transparent 70%);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: blur(40px);
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      from { transform: translate(-50%, -50%) scale(0.95); opacity: 0.7; }
      to { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    }

    /* Glassmorphism Card Container */
    .card {
      position: relative;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 40px 48px;
      text-align: center;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6),
                  0 0 40px rgba(99, 102, 241, 0.08);
      max-width: 440px;
      width: 90%;
      animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }

    .logo-img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      filter: drop-shadow(0 8px 16px rgba(99, 102, 241, 0.35));
      animation: floatLogo 3s ease-in-out infinite alternate;
    }

    @keyframes floatLogo {
      from { transform: translateY(0); }
      to { transform: translateY(-4px); }
    }

    .title {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.9rem;
      font-weight: 500;
      color: #818cf8;
      letter-spacing: 0.04em;
      margin-bottom: 32px;
    }

    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 16px;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4f46e5, #3b82f6, #06b6d4);
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.6);
      position: relative;
    }

    /* Shimmer effect inside progress bar */
    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .status-text {
      font-size: 0.85rem;
      color: #94a3b8;
      min-height: 1.4em;
      font-weight: 400;
      transition: opacity 0.2s ease;
    }

    /* Dynamic Version Footer */
    .version-pill {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #64748b;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 4px 12px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="glow-orb"></div>

  <div class="card">
    <div class="logo-wrap">
      <img class="logo-img" src="../public/logo_cropped.png" alt="ZSystems Logo" onerror="this.style.display='none'">
    </div>
    <div class="title">ZSystems POS</div>
    <div class="subtitle">نظام نقاط البيع وإدارة المخازن</div>

    <div class="progress-track">
      <div class="progress-fill" id="progressBar"></div>
    </div>
    <div class="status-text" id="statusText">جاري بدء تشغيل السيرفر الداخلي...</div>
  </div>

  <div class="version-pill" id="versionBadge">v...</div>

  <script>
    // Read dynamic version from URL query parameter (?v=1.1.13)
    const urlParams = new URLSearchParams(window.location.search);
    const ver = urlParams.get('v') || '1.1.13';
    document.getElementById('versionBadge').textContent = 'v' + ver;

    const bar = document.getElementById('progressBar');
    const statusText = document.getElementById('statusText');

    // Dynamic responsive loading animation steps
    const steps = [
      { pct: 25, text: 'جاري تشغيل قاعدة البيانات والخدمات...', delay: 300 },
      { pct: 55, text: 'جاري تهيئة النظام والمزامنة...', delay: 1000 },
      { pct: 85, text: 'جاري فحص حالة الاتصال والترخيص...', delay: 1800 },
      { pct: 98, text: 'جاري فتح واجهة البرنامج...', delay: 2600 },
    ];

    steps.forEach(s => {
      setTimeout(() => {
        if (bar) bar.style.width = s.pct + '%';
        if (statusText) statusText.textContent = s.text;
      }, s.delay);
    });
  </script>
</body>
</html>
