<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z-ERP Enterprise</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at 50% 40%, #1e1b4b 0%, #0f172a 60%, #030712 100%);
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans Arabic', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Ambient background glow */
    .glow-orb {
      position: absolute;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, rgba(16, 185, 129, 0.08) 45%, transparent 70%);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: blur(50px);
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      from { transform: translate(-50%, -50%) scale(0.92); opacity: 0.75; }
      to { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
    }

    /* Luxury Executive Card */
    .card {
      position: relative;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 44px 44px 38px;
      text-align: center;
      box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.1);
      max-width: 470px;
      width: 90%;
      animation: cardAppear 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10;
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(18px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }

    .logo-img {
      width: 74px;
      height: 74px;
      object-fit: contain;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.16));
      animation: floatLogo 3s ease-in-out infinite alternate;
    }

    @keyframes floatLogo {
      from { transform: translateY(0); }
      to { transform: translateY(-4px); }
    }

    .title {
      font-size: 1.75rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.92rem;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 8px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 16px;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563eb 0%, #3b82f6 50%, #10b981 100%);
      border-radius: 999px;
      transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .status-text {
      font-size: 0.88rem;
      color: #475569;
      min-height: 1.5em;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }

    /* Dynamic Version Footer */
    .version-pill {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 16px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      z-index: 10;
    }

    .version-dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 6px #10b981;
    }
  </style>
</head>
<body>
  <div class="glow-orb"></div>

  <div class="card">
    <div class="logo-wrap">
      <img class="logo-img" src="../public/brand/z-erp-approved-icon.png" alt="Z-ERP" onerror="this.src='../public/logo_cropped.png';">
    </div>
    <div class="title">Z-ERP Enterprise</div>
    <div class="subtitle">منظومة إدارة المبيعات ونقاط التشغيل والمخازن</div>

    <div class="progress-track">
      <div class="progress-fill" id="progressBar"></div>
    </div>
    <div class="status-text" id="statusText">جاري تشغيل محرك قواعد البيانات والخدمات المحلية...</div>
  </div>

  <div class="version-pill" id="versionBadge">
    <span class="version-dot"></span>
    <span id="versionText">نظام مؤمن • v...</span>
  </div>

  <script>
    // 1. Check URL query params first
    const urlParams = new URLSearchParams(window.location.search);
    let ver = urlParams.get('v');

    // 2. Fallback to localStorage cached version
    try {
      const cached = localStorage.getItem('zs.app_display_version');
      if (cached) {
        ver = cached;
      }
    } catch (e) {}

    if (ver) {
      document.getElementById('versionText').textContent = 'نظام مؤمن • v' + ver.replace(/^v/i, '');
    }

    // 3. Dynamic polling to local backend API
    async function updateVersionFromBackend() {
      for (const p of [3001, 3002, 3003, 3004, 3005]) {
        try {
          const res = await fetch('http://127.0.0.1:' + p + '/api/updates/version');
          if (res.ok) {
            const data = await res.json();
            if (data && data.version) {
              document.getElementById('versionText').textContent = 'نظام مؤمن • v' + data.version.replace(/^v/i, '');
              try { localStorage.setItem('zs.app_display_version', data.version); } catch (e) {}
              break;
            }
          }
        } catch (e) {}
      }
    }
    updateVersionFromBackend();
    const verInterval = setInterval(updateVersionFromBackend, 600);
    setTimeout(() => clearInterval(verInterval), 8000);

    const bar = document.getElementById('progressBar');
    const statusText = document.getElementById('statusText');

    // Dynamic responsive loading animation steps
    const steps = [
      { pct: 25, text: 'جاري تشغيل محرك قواعد البيانات والخدمات المحلية...', delay: 300 },
      { pct: 55, text: 'التحقق من سلامة البيانات والتراخيص المعتمدة...', delay: 1100 },
      { pct: 85, text: 'تجهيز واجهات نقطة البيع وتهيئة بيئة العمل...', delay: 2000 },
      { pct: 98, text: 'اكتمل الإقلاع! جاري فتح المنظومة...', delay: 2800 },
    ];

    steps.forEach(s => {
      setTimeout(() => {
        if (bar) bar.style.width = s.pct + '%';
        if (statusText) statusText.textContent = s.text;
      }, s.delay);
    });
  </script>
</body>
</html>
