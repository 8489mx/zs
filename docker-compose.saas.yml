services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_MODE: CLOUD_SAAS
      PORTABLE_MODE: "false"
      IS_ELECTRON: "false"
      LICENSE_MODE: server
      PLATFORM_TENANT_ID: ${PLATFORM_TENANT_ID:-zs}
      TENANT_ID: ${TENANT_ID:-zs}
      ACCOUNT_ID: ${ACCOUNT_ID:-zs}
      NODE_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 3001
      LOG_LEVEL: info
      DATABASE_HOST: ${DATABASE_HOST:?DATABASE_HOST is required for CLOUD_SAAS}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:?DATABASE_NAME is required for CLOUD_SAAS}
      DATABASE_USER: ${DATABASE_USER:?DATABASE_USER is required for CLOUD_SAAS}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required for CLOUD_SAAS}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-public}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${DATABASE_SSL_REJECT_UNAUTHORIZED:-true}
      DATABASE_SSL_CA_CERT: ${DATABASE_SSL_CA_CERT:-}
      DATABASE_LOGGING: "false"
      ENABLE_BOOTSTRAP_ADMIN: ${ENABLE_BOOTSTRAP_ADMIN:-false}
      ALLOW_BOOTSTRAP_ADMIN_IN_PRODUCTION: "false"
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-strict}
      SESSION_CSRF_SECRET: ${SESSION_CSRF_SECRET:?SESSION_CSRF_SECRET is required}
      ALLOW_SESSION_ID_HEADER: "false"
      LOGIN_MAX_ATTEMPTS: 5
      LOGIN_LOCKOUT_MINUTES: 15
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must list the public HTTPS origins}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:?MAIL_FROM_EMAIL is required}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Z Systems}
      LOGIN_RATE_LIMIT_MAX: 10
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: 600
      AUTH_BURST_RATE_LIMIT_MAX: 60
      AUTH_BURST_RATE_LIMIT_WINDOW_SECONDS: 60
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-UTC}
    command: sh -c "npm run migration:run && npm start"
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    volumes:
      - ./deploy/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${APP_PUBLIC_PORT:-80}:80"
