name: P0-A isolated security verification

on:
  push:
    branches: [fix/platform-core-security-audit-20261025]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-security:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zs_p0a_isolated
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d zs_p0a_isolated"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      APP_MODE: CLOUD_SAAS
      PLATFORM_TENANT_ID: zs
      TENANT_ID: zs
      ACCOUNT_ID: zs
      APP_HOST: 127.0.0.1
      APP_PORT: 3001
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5433
      DATABASE_NAME: zs_p0a_isolated
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_SCHEMA: public
      DATABASE_SSL: 'false'
      SESSION_CSRF_SECRET: disposable-p0a-ci-csrf-secret-0123456789
      SESSION_COOKIE_SECURE: 'false'
      SESSION_COOKIE_SAME_SITE: lax
      ALLOW_SESSION_ID_HEADER: 'false'
      CORS_ORIGINS: http://127.0.0.1:5173
      DOTENV_CONFIG_PATH: /dev/null
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend pinned dependencies
        id: install
        run: npm ci
        working-directory: backend
      - name: Typecheck
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run typecheck
        working-directory: backend
      - name: Build
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run build
        working-directory: backend
      - name: Architecture and environment guards
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          npm run check:architecture
          npm run check:permissions
          npm run check:env-safety
        working-directory: backend
      - name: P0-A source and security regressions
        if: ${{ always() && steps.install.outcome == 'success' }}
        shell: bash
        working-directory: backend
        run: |
          shopt -s nullglob
          failed=0
          for f in test/critical/p0a-*.spec.ts \
                   test/critical/subscription-sandbox-boundary.spec.ts \
                   test/critical/platform-auth-boundaries-p0a.spec.ts \
                   test/critical/backup-platform-boundary-p0a.spec.ts \
                   test/critical/session-login-atomic-p0a.spec.ts \
                   test/critical/backup-mode-boundary-p0a.spec.ts \
                   test/critical/login-mode-boundary-p0a.spec.ts; do
            echo "::group::${f}"
            npx ts-node "${f}" || failed=1
            echo "::endgroup::"
          done
          exit "${failed}"
      - name: Authentication, tenant and destructive-data regressions
        if: ${{ always() && steps.install.outcome == 'success' }}
        working-directory: backend
        shell: bash
        run: |
          failed=0
          for f in session-auth.spec.ts session-auth.guard.spec.ts super-admin-role.guard.spec.ts \
                   tenant-boundary.spec.ts tenant-context.spec.ts tenant-scoped-reads.spec.ts \
                   password-reset.spec.ts totp-mfa.spec.ts tenant-transfer.spec.ts \
                   backup-restore-integrity.spec.ts idempotency.spec.ts; do
            npx ts-node "test/critical/${f}" || failed=1
          done
          exit "${failed}"
      - name: Apply every migration including 255 to disposable PostgreSQL
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run migration:run
        working-directory: backend
      - name: PostgreSQL core integrity acceptance
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npx ts-node test/critical/core-integrity-audit.spec.ts
        working-directory: backend
