name: Deploy to Oracle SaaS Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-oracle-saas
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to Oracle Cloud VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: SSH and Deploy to Oracle Server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 ubuntu@92.5.178.54 'bash -s' > server-diag.txt 2>&1 << 'REMOTEEVERYTHING'
          echo "🚀 Connected to Oracle VPS successfully at $(date)"
          
          TARGET_DIR="/var/www/zsystems/app"
          if [ ! -d "$TARGET_DIR" ]; then
            TARGET_DIR="/var/www/zsystems"
          fi
          echo "📂 TARGET_DIR is: $TARGET_DIR"
          cd "$TARGET_DIR"

          echo "=== 1. Git update ==="
          git config --global --add safe.directory "$TARGET_DIR" 2>/dev/null || true
          git fetch origin main 2>&1
          git reset --hard origin/main 2>&1

          echo "=== 2. Locate .env and Check Configuration ==="
          ENV_FILE=""
          for f in "$TARGET_DIR/backend/.env" "$TARGET_DIR/.env" "/var/www/zsystems/.env"; do
            if [ -f "$f" ]; then
              ENV_FILE="$f"
              echo "Found env file: $f"
              break
            fi
          done

          if [ -n "$ENV_FILE" ]; then
            echo "PORT in env file:"
            grep -E 'PORT|HOST|NODE_ENV|APP_MODE' "$ENV_FILE" || true
          else
            echo "⚠️ No .env file found in standard locations!"
            find /var/www/zsystems /home/ubuntu -maxdepth 3 -name ".env*" 2>/dev/null || true
          fi

          echo "=== 3. Clean and Build Backend ==="
          cd "$TARGET_DIR/backend"
          npm install --silent 2>&1 || true
          npm run migration:run 2>&1 || true
          rm -rf dist
          npm run build 2>&1
          echo "Files in dist:"
          ls -la dist/ || true
          echo "Files in dist/config:"
          ls -la dist/config/ 2>/dev/null || true

          echo "=== 4. Test run main.js directly ==="
          if [ -n "$ENV_FILE" ]; then
            timeout 4 node --env-file="$ENV_FILE" dist/main.js 2>&1 || true
          else
            timeout 4 node dist/main.js 2>&1 || true
          fi

          echo "=== 5. Start with PM2 ==="
          pm2 delete all 2>/dev/null || true
          cd "$TARGET_DIR/backend"
          if [ -n "$ENV_FILE" ]; then
            pm2 start dist/main.js --name zsystems-backend --cwd "$TARGET_DIR/backend" --node-args="--env-file=$ENV_FILE" 2>&1
          else
            pm2 start dist/main.js --name zsystems-backend --cwd "$TARGET_DIR/backend" 2>&1
          fi
          pm2 save 2>&1 || true

          sleep 5
          echo "=== 6. PM2 Status & Logs ==="
          pm2 list
          pm2 logs zsystems-backend --nostream --lines 50 2>&1 || true

          echo "=== 7. Check listening ports and test HTTP ==="
          sudo ss -tulpn | grep -E '3000|3001|5432|80|443' || true
          curl -sv http://127.0.0.1:3000/api/activation/status 2>&1 || true

          echo "=== 8. Reload Nginx ==="
          sudo systemctl reload nginx 2>/dev/null || true

          echo "=== Execution completed at $(date) ==="
          REMOTEEVERYTHING

      - name: Push diagnostics to server-diag branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B server-diag
          git add -f server-diag.txt
          git commit -m "chore: server diagnostics $(date +'%Y-%m-%d %H:%M:%S') [skip ci]" || true
          git push -f origin server-diag || true

