name: Deploy to Oracle SaaS Server

# البناء يتم هنا على GitHub وليس على سيرفر الإنتاج: السيرفر نواة واحدة، وبناء
# الباك إند والفرونت إند عليه كان يجمّد الكاشيرات لدقائق مع كل نشر، وكان
# `rm -rf dist` قبل البناء يُسقط الباك إند طوال مدة البناء (1754 إعادة تشغيل
# فاشلة مسجلة في PM2 بسبب اختفاء dist/main.js).
#
# السيرفر يستلم ملفاً جاهزاً، يشغّل الهجرات، ثم يبدّل المجلدات دفعة واحدة.
# إن فشل فحص الصحة بعد التبديل يرجع تلقائياً للنسخة السابقة.

on:
  workflow_run:
    workflows: ["ci"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-oracle-saas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build on GitHub and deploy to Oracle Cloud VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout the exact commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build
          test -f dist/main.js

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}
          VITE_CSRF_COOKIE_NAME: ${{ vars.VITE_CSRF_COOKIE_NAME || 'zs_cloud_csrf_token' }}
          VITE_PLATFORM_TENANT_ID: ${{ vars.VITE_PLATFORM_TENANT_ID || 'zsystems-main' }}
          # SF-10: set to the root domain (e.g. zsystemai.com) only after wildcard DNS + nginx are live;
          # must match STOREFRONT_ROOT_DOMAIN in backend/.env. Empty = stores stay on /st/<slug>.
          VITE_STOREFRONT_ROOT_DOMAIN: ${{ vars.VITE_STOREFRONT_ROOT_DOMAIN || '' }}
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: Package release
        run: |
          tar -czf release.tgz backend/dist frontend/dist
          ls -lh release.tgz

      - name: Upload release to server
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST || '92.5.178.54' }}
          ORACLE_USER: ${{ secrets.ORACLE_USER || 'ubuntu' }}
          ORACLE_PORT: ${{ secrets.ORACLE_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          echo "$ORACLE_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P "$ORACLE_PORT" \
            release.tgz "$ORACLE_USER@$ORACLE_HOST:/tmp/zsystems-release-$DEPLOY_SHA.tgz"

      - name: Migrate, swap and reload on server
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST || '92.5.178.54' }}
          ORACLE_USER: ${{ secrets.ORACLE_USER || 'ubuntu' }}
          ORACLE_PORT: ${{ secrets.ORACLE_PORT || '22' }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p "$ORACLE_PORT" "$ORACLE_USER@$ORACLE_HOST" \
            "DEPLOY_SHA=$DEPLOY_SHA bash -s" << 'REMOTE'
          set -euo pipefail
          echo "Deploying $DEPLOY_SHA at $(date)"

          TARGET_DIR="/var/www/zsystems/app"
          [ -d "$TARGET_DIR" ] || TARGET_DIR="/var/www/zsystems"
          RELEASE_TGZ="/tmp/zsystems-release-$DEPLOY_SHA.tgz"
          STAGE_DIR="/var/www/zsystems/.deploy-stage"
          cd "$TARGET_DIR"

          echo "=== 1. Source update (needed for migrations) ==="
          git config --global --add safe.directory "$TARGET_DIR" 2>/dev/null || true
          git fetch origin main
          git reset --hard "$DEPLOY_SHA"

          echo "=== 2. Backend dependencies (only when the lockfile changed) ==="
          cd "$TARGET_DIR/backend"
          LOCK_HASH=$(sha256sum package-lock.json | cut -d' ' -f1)
          if [ ! -d node_modules ] || [ "$(cat node_modules/.zs-lock-hash 2>/dev/null || true)" != "$LOCK_HASH" ]; then
            npm ci --no-audit --no-fund
            echo "$LOCK_HASH" > node_modules/.zs-lock-hash
          else
            echo "package-lock.json unchanged - skipping npm ci"
          fi

          echo "=== 3. Unpack prebuilt release ==="
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"
          tar -xzf "$RELEASE_TGZ" -C "$STAGE_DIR"
          test -f "$STAGE_DIR/backend/dist/main.js"
          test -f "$STAGE_DIR/frontend/dist/index.html"

          echo "=== 4. Database migrations (before the new code goes live) ==="
          npm run migration:run

          echo "=== 5. Swap in the new build ==="
          swap_in() {
            local live="$1" fresh="$2"
            rm -rf "$live.prev"
            if [ -d "$live" ]; then mv "$live" "$live.prev"; fi
            mv "$fresh" "$live"
          }
          swap_back() {
            local live="$1"
            if [ -d "$live.prev" ]; then rm -rf "$live"; mv "$live.prev" "$live"; fi
          }
          swap_in "$TARGET_DIR/backend/dist" "$STAGE_DIR/backend/dist"
          swap_in "$TARGET_DIR/frontend/dist" "$STAGE_DIR/frontend/dist"

          echo "=== 6. Reload backend ==="
          ENV_FILE=""
          for f in "$TARGET_DIR/backend/.env" "$TARGET_DIR/.env" "/var/www/zsystems/.env"; do
            if [ -f "$f" ]; then ENV_FILE="$f"; break; fi
          done
          if pm2 describe zsystems-backend > /dev/null 2>&1; then
            pm2 reload zsystems-backend --update-env
          elif [ -n "$ENV_FILE" ]; then
            pm2 start dist/main.js --name zsystems-backend --cwd "$TARGET_DIR/backend" --node-args="--env-file=$ENV_FILE"
          else
            pm2 start dist/main.js --name zsystems-backend --cwd "$TARGET_DIR/backend"
          fi

          echo "=== 7. Health check ==="
          check_health() {
            for i in $(seq 1 20); do
              sleep 3
              LIVE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health/live || true)
              READY=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health/ready || true)
              echo "Probe #$i -> live: $LIVE, ready: $READY"
              if [ "$LIVE" = "200" ] && [ "$READY" = "200" ]; then return 0; fi
            done
            return 1
          }

          if ! check_health; then
            echo "New build is unhealthy - rolling back to the previous build"
            pm2 logs zsystems-backend --nostream --lines 50 || true
            swap_back "$TARGET_DIR/backend/dist"
            swap_back "$TARGET_DIR/frontend/dist"
            pm2 reload zsystems-backend --update-env || true
            check_health || echo "WARNING: previous build is not healthy either"
            exit 1
          fi

          pm2 save || true
          rm -rf "$STAGE_DIR" "$RELEASE_TGZ"
          if [ -f "$TARGET_DIR/deploy/nginx/zsystemai-subdomains.conf" ] && [ -f /etc/nginx/sites-available/zsystemai-subdomains ]; then
            sudo cp "$TARGET_DIR/deploy/nginx/zsystemai-subdomains.conf" /etc/nginx/sites-available/zsystemai-subdomains 2>/dev/null || true
            sudo nginx -t 2>/dev/null && sudo systemctl reload nginx 2>/dev/null || true
          else
            sudo systemctl reload nginx 2>/dev/null || true
          fi
          echo "Deployed $DEPLOY_SHA successfully"
          REMOTE

      # Telegram is for critical alerts only: a failed or rolled-back deploy can mean production is
      # affected. Successful deploys are visible in GitHub and would only flood the chat.
      - name: Send Telegram Deployment Notification
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            if [ "$DEPLOY_STATUS" = "success" ]; then
              TEXT="🚀 *Z-Systems Deployment Succeeded!*%0A━━━━━━━━━━━━━━━━━%0A*Server:* Oracle Cloud VPS%0A*Branch:* main%0A*Commit:* \`${DEPLOY_SHA}\`%0A*Author:* ${{ github.actor }}%0A*Status:* 🟢 Production Live & Healthy"
            else
              TEXT="🚨 *Z-Systems Deployment Alert!*%0A━━━━━━━━━━━━━━━━━%0A*Server:* Oracle Cloud VPS%0A*Branch:* main%0A*Commit:* \`${DEPLOY_SHA}\`%0A*Status:* 🔴 Deployment Failed or Rolled Back"
            fi
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${TEXT}" \
              -d "parse_mode=Markdown" || true
          fi
