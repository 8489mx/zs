name: Deploy to Oracle SaaS Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-oracle-saas
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to Oracle Cloud VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: SSH and Deploy to Oracle Server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 ubuntu@92.5.178.54 'bash -s' > server-diag.txt 2>&1 << 'REMOTEEVERYTHING'
          echo "🚀 Connected to Oracle VPS successfully at $(date)"
          
          TARGET_DIR=""
          for dir in "/var/www/zsystems" "/var/www/zs" "/home/ubuntu/zsystems" "/home/ubuntu/zs"; do
            if [ -d "$dir" ]; then
              TARGET_DIR="$dir"
              break
            fi
          done

          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR="/var/www/zsystems"
          fi
          echo "📂 TARGET_DIR is: $TARGET_DIR"
          cd "$TARGET_DIR"

          echo "=== 1. Check update.sh content ==="
          if [ -f "/var/www/zsystems/update.sh" ]; then
            cat "/var/www/zsystems/update.sh"
          elif [ -f "$TARGET_DIR/update.sh" ]; then
            cat "$TARGET_DIR/update.sh"
          else
            echo "No update.sh file found"
          fi

          echo "=== 2. Nginx configuration ==="
          cat /etc/nginx/sites-enabled/* 2>/dev/null || true

          echo "=== 3. Nginx error log ==="
          sudo tail -n 25 /var/log/nginx/error.log 2>/dev/null || true

          echo "=== 4. PM2 status and logs ==="
          pm2 list 2>/dev/null || true
          pm2 logs --nostream --lines 30 2>/dev/null || true

          echo "=== 5. Systemd services ==="
          sudo systemctl list-units --type=service 2>/dev/null | grep -E 'zs|backend|node|app' || true

          echo "=== 6. Listening ports before update ==="
          sudo ss -tulpn 2>/dev/null || true

          echo "=== 7. Git update ==="
          git config --global --add safe.directory "$TARGET_DIR" 2>/dev/null || true
          git fetch origin main 2>&1
          git reset --hard origin/main 2>&1

          echo "=== 8. Run update.sh if present ==="
          if [ -f "/var/www/zsystems/update.sh" ]; then
            chmod +x /var/www/zsystems/update.sh
            /var/www/zsystems/update.sh 2>&1 || true
          fi

          echo "=== 9. Ensure backend is built & running ==="
          if [ ! -f "$TARGET_DIR/backend/dist/main.js" ]; then
            echo "Building backend..."
            cd "$TARGET_DIR/backend"
            npm install --include=dev --no-audit --no-fund 2>&1 || true
            npx nest build 2>&1 || true
            cd "$TARGET_DIR"
          fi

          if command -v pm2 &>/dev/null; then
            echo "Restarting PM2..."
            pm2 restart all --update-env 2>&1 || pm2 start "$TARGET_DIR/hostinger-api-entry.cjs" --name zsystems 2>&1 || true
            pm2 save 2>&1 || true
          fi

          echo "=== 10. Check port 3001 and local health ==="
          sleep 4
          sudo ss -tulpn 2>/dev/null | grep -E '3000|3001|5432|80|443' || true
          curl -iv http://127.0.0.1:3001/health 2>&1 || true

          echo "=== Execution completed at $(date) ==="
          REMOTEEVERYTHING

      - name: Push diagnostics to server-diag branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B server-diag
          git add -f server-diag.txt
          git commit -m "chore: server diagnostics $(date +'%Y-%m-%d %H:%M:%S') [skip ci]" || true
          git push -f origin server-diag || true

