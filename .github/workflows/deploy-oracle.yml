name: Deploy to Oracle SaaS Server

on:
  workflow_run:
    workflows: ["ci"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-oracle-saas
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Oracle Cloud VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: SSH and Deploy to Oracle Server
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST || '92.5.178.54' }}
          ORACLE_USER: ${{ secrets.ORACLE_USER || 'ubuntu' }}
          ORACLE_PORT: ${{ secrets.ORACLE_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          echo "$ORACLE_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p "$ORACLE_PORT" "$ORACLE_USER@$ORACLE_HOST" 'bash -s' << 'REMOTEEVERYTHING'
          set -e
          echo "========================================================"
          echo "🚀 Oracle Cloud VPS Production Deployment Started at $(date)"
          echo "========================================================"
          
          TARGET_DIR="/var/www/zsystems/app"
          if [ ! -d "$TARGET_DIR" ]; then
            TARGET_DIR="/var/www/zsystems"
          fi
          echo "📂 Deploy Target Directory: $TARGET_DIR"
          cd "$TARGET_DIR"

          echo "=== 1. Safe Git Update ==="
          git config --global --add safe.directory "$TARGET_DIR" 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main

          echo "=== 2. Environment Verification ==="
          ENV_FILE=""
          for f in "$TARGET_DIR/backend/.env" "$TARGET_DIR/.env" "/var/www/zsystems/.env"; do
            if [ -f "$f" ]; then
              ENV_FILE="$f"
              echo "Found env file: $f"
              break
            fi
          done

          if [ -z "$ENV_FILE" ]; then
            echo "⚠️ Warning: No explicit .env file found in target root. Relying on system/PM2 environment."
          fi

          echo "=== 3. Backend Build & Migrations ==="
          cd "$TARGET_DIR/backend"
          npm ci --prefer-offline || npm install
          rm -rf dist
          npm run build
          
          echo "Running database schema migrations..."
          npm run migration:run

          echo "=== 4. Frontend Build ==="
          cd "$TARGET_DIR/frontend"
          npm ci --prefer-offline || npm install
          npm run build || node ./node_modules/vite/bin/vite.js build

          echo "=== 5. Graceful PM2 Backend Reload (Zero Downtime) ==="
          cd "$TARGET_DIR/backend"
          if pm2 describe zsystems-backend > /dev/null 2>&1; then
            echo "Reloading existing PM2 process 'zsystems-backend'..."
            pm2 reload zsystems-backend --update-env
          else
            echo "Starting new PM2 process 'zsystems-backend'..."
            if [ -n "$ENV_FILE" ]; then
              pm2 start dist/main.js --name zsystems-backend --cwd "$TARGET_DIR/backend" --node-args="--env-file=$ENV_FILE"
            else
              pm2 start dist/main.js --name zsystems-backend --cwd "$TARGET_DIR/backend"
            fi
          fi
          pm2 save || true

          echo "=== 6. Automated Health Check Verification ==="
          HEALTHY=false
          for i in $(seq 1 15); do
            sleep 2
            HTTP_LIVE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health/live || curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/health/live || true)
            HTTP_READY=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health/ready || curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/health/ready || true)
            
            echo "Health Probe #$i -> live: $HTTP_LIVE, ready: $HTTP_READY"
            if [ "$HTTP_LIVE" = "200" ] && [ "$HTTP_READY" = "200" ]; then
              HEALTHY=true
              break
            fi
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "❌ Health check verification failed! Backend did not become healthy in time."
            echo "=== Recent Backend Logs ==="
            pm2 logs zsystems-backend --nostream --lines 50 || true
            exit 1
          fi

          echo "=== 7. Reload Nginx ==="
          sudo systemctl reload nginx 2>/dev/null || true

          echo "========================================================"
          echo "✅ Production Deployment to Oracle VPS Completed Successfully!"
          echo "========================================================"
          REMOTEEVERYTHING

      - name: Send Telegram Deployment Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            if [ "$DEPLOY_STATUS" = "success" ]; then
              TEXT="🚀 *Z-Systems Deployment Succeeded!*%0A━━━━━━━━━━━━━━━━━%0A*Server:* Oracle Cloud VPS%0A*Branch:* main%0A*Commit:* \`${{ github.sha }}\`%0A*Author:* ${{ github.actor }}%0A*Status:* 🟢 Production Live & Healthy"
            else
              TEXT="🚨 *Z-Systems Deployment Alert!*%0A━━━━━━━━━━━━━━━━━%0A*Server:* Oracle Cloud VPS%0A*Branch:* main%0A*Commit:* \`${{ github.sha }}\`%0A*Status:* 🔴 Deployment Failed or Unhealthy"
            fi
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${TEXT}" \
              -d "parse_mode=Markdown" || true
          fi


