name: Deploy to Oracle SaaS Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-oracle-saas
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Oracle Cloud VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: SSH and Update Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 92.5.178.54
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 12m
          script: |
            echo "🚀 Starting automated deployment & diagnostics..."
            
            TARGET_DIR=""
            for dir in "/var/www/zsystems" "/var/www/zs" "/home/ubuntu/zsystems" "/home/ubuntu/zs" "/home/ubuntu/z-systems"; do
              if [ -d "$dir" ]; then
                TARGET_DIR="$dir"
                break
              fi
            done

            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="/var/www/zsystems"
              sudo mkdir -p "$TARGET_DIR"
              sudo chown -R ubuntu:ubuntu "$TARGET_DIR"
            fi

            echo "📂 Working directory: $TARGET_DIR"
            cd "$TARGET_DIR"
            git config --global --add safe.directory "$TARGET_DIR" || true

            if [ ! -d ".git" ]; then
              echo "⚙️ Initializing git repository..."
              git init
            fi

            echo "📥 Fetching latest code from origin/main..."
            git remote remove origin 2>/dev/null || true
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/8489mx/zs.git
            git fetch origin main
            git reset --hard origin/main
            git remote set-url origin https://github.com/8489mx/zs.git

            # --- DIAGNOSTICS START ---
            DIAG_FILE="/tmp/diag.txt"
            echo "=== SERVER DIAGNOSTICS $(date) ===" > "$DIAG_FILE"
            echo "--- update.sh content ---" >> "$DIAG_FILE"
            if [ -f "/var/www/zsystems/update.sh" ]; then
              cat "/var/www/zsystems/update.sh" >> "$DIAG_FILE" 2>&1
            elif [ -f "./update.sh" ]; then
              cat "./update.sh" >> "$DIAG_FILE" 2>&1
            else
              echo "No update.sh file found" >> "$DIAG_FILE"
            fi

            echo "--- Nginx configuration ---" >> "$DIAG_FILE"
            cat /etc/nginx/sites-enabled/* >> "$DIAG_FILE" 2>&1 || true

            echo "--- Nginx error log (last 30) ---" >> "$DIAG_FILE"
            sudo tail -n 30 /var/log/nginx/error.log >> "$DIAG_FILE" 2>&1 || true

            echo "--- Listening ports ---" >> "$DIAG_FILE"
            sudo ss -tulpn >> "$DIAG_FILE" 2>&1 || true

            echo "--- PM2 status ---" >> "$DIAG_FILE"
            pm2 list >> "$DIAG_FILE" 2>&1 || true

            echo "--- PM2 logs (last 40) ---" >> "$DIAG_FILE"
            pm2 logs --nostream --lines 40 >> "$DIAG_FILE" 2>&1 || true

            echo "--- Running node processes ---" >> "$DIAG_FILE"
            ps aux | grep node >> "$DIAG_FILE" 2>&1 || true

            echo "--- Systemd services ---" >> "$DIAG_FILE"
            sudo systemctl list-units --type=service | grep -E 'zs|backend|node|app' >> "$DIAG_FILE" 2>&1 || true

            # Execute update.sh if present
            if [ -f "/var/www/zsystems/update.sh" ]; then
              echo "--- Executing /var/www/zsystems/update.sh ---" >> "$DIAG_FILE"
              chmod +x /var/www/zsystems/update.sh
              /var/www/zsystems/update.sh >> "$DIAG_FILE" 2>&1 || true
            elif [ -f "./update.sh" ]; then
              echo "--- Executing ./update.sh ---" >> "$DIAG_FILE"
              chmod +x ./update.sh
              ./update.sh >> "$DIAG_FILE" 2>&1 || true
            fi

            # Check if backend is alive after update.sh
            echo "--- Health check after update.sh ---" >> "$DIAG_FILE"
            curl -sv http://127.0.0.1:3001/health >> "$DIAG_FILE" 2>&1 || true

            # If PM2 is managing the process, restart it now to pick up fresh dist
            if command -v pm2 &>/dev/null; then
              echo "--- Restarting via PM2 ---" >> "$DIAG_FILE"
              pm2 restart all --update-env >> "$DIAG_FILE" 2>&1 || true
            fi

            echo "--- Final listening ports ---" >> "$DIAG_FILE"
            sudo ss -tulpn >> "$DIAG_FILE" 2>&1 || true

            echo "--- Final health check ---" >> "$DIAG_FILE"
            curl -sv http://127.0.0.1:3001/health >> "$DIAG_FILE" 2>&1 || true

            # Publish diag.txt to web root so it can be fetched via browser / curl
            for webdir in "$TARGET_DIR/frontend/dist" "/var/www/html" "/var/www/zsystems/frontend/dist"; do
              if [ -d "$webdir" ]; then
                sudo cp "$DIAG_FILE" "$webdir/diag.txt" || true
                sudo chmod 644 "$webdir/diag.txt" || true
              fi
            done

            cat "$DIAG_FILE"
            echo "✅ Deployment step finished."

