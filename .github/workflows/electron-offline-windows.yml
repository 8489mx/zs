name: Electron Offline Windows release gate
on:
  push:
    branches:
      - fix/erp-customer-release-gates
  workflow_dispatch:

concurrency:
  group: electron-offline-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  electron-windows:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install Windows Electron and renderer dependencies
        working-directory: frontend
        run: npm ci
      - name: Compile Windows Electron renderer
        working-directory: frontend
        run: npm run build:electron-frontend
      - name: Run Electron updater and rollback contract checks
        run: npm run qa:electron
      - name: Verify Windows configuration persistence and failed-write recovery
        run: node --test scripts/test-electron-customer-config.cjs
      - name: Stage trusted Windows PostgreSQL and Node runtime, verify hashes
        shell: pwsh
        run: ./scripts/release/stage-windows-offline-runtime.ps1
      - name: Install Windows backend dependencies
        working-directory: backend
        run: npm ci
      - name: Build full offline Windows EXE
        run: npm run build:exe
      - name: Check packaged runtime, actual PostgreSQL boot, durable data and backend
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $packageDir = Join-Path 'release' "Z-ERP-Offline-v$version-win-x64"
          node scripts/release/test-windows-offline-runtime.cjs $packageDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload clean and validated Windows customer candidate
        uses: actions/upload-artifact@v4
        with:
          name: zs-clothing-offline-windows-x64
          path: release/Z-ERP-Offline-*-win-x64/
          if-no-files-found: error
          retention-days: 3
          compression-level: 1
