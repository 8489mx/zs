name: Retail offline acceptance (branch-only)

on:
  push:
    branches:
      - fix/retail-clothing-complete-audit-20261025
    paths:
      - '.github/workflows/retail-offline-acceptance.yml'
      - 'frontend/src/**'
      - 'backend/src/**'
      - 'frontend/package*.json'
      - 'backend/package*.json'
      - 'frontend/electron/**'
      - 'scripts/test-electron-update-lifecycle.cjs'

permissions:
  contents: read

jobs:
  frontend-retail:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install reproducible frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Clothing, POS, inventory, returns and Electron unit tests
        working-directory: frontend
        run: npm run test:run
      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Electron frontend build (not a Windows app acceptance)
        working-directory: frontend
        run: npm run build:electron-frontend
      - name: Electron scripts static lifecycle checks
        run: npm run qa:electron

  backend-retail:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install reproducible backend dependencies
        working-directory: backend
        run: npm ci
      - name: Backend typecheck and bundle
        working-directory: backend
        run: |
          npm run typecheck
          npm run build
      - name: Retail stock and return critical unit regressions
        working-directory: backend
        run: |
          npx ts-node test/critical/fashion-stock-safety.spec.ts
          npx ts-node test/critical/grn-explicit-location.spec.ts
          npx ts-node test/critical/return-invoice-quantities.spec.ts
          npx ts-node test/critical/sales-return-cost.spec.ts
          npx ts-node test/critical/financial-integrity.spec.ts
          npx ts-node test/critical/accounting-commercial-posting.spec.ts
          npx ts-node test/infra/cash-drawer-cash-return.spec.ts
          npx ts-node test/infra/reports-inventory.helper.spec.ts
